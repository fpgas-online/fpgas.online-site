[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "fpgas-online-site"
version = "0.1.0"
description = "Django web application for fpgas.online"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2",
    "channels[daphne]>=4.0",
    "paramiko",
    "requests>=2.31",
    "PyYAML>=6",
    "fpgas-online-poe @ git+https://github.com/fpgas-online/fpgas.online-poe.git",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = [".", "pibfpgas/src", "pistat/src", "pibdemos/src", "pibup/src", "ttsite/src"]
include = ["pib", "pib.*", "pibfpgas*", "pistat*", "pibdemos*", "pibup*", "ttsite*"]
exclude = ["tests*"]
# every real package has an __init__.py; without this, PEP-420 discovery from
# "." also claims data dirs such as pibdemos/nginx as namespace packages
namespaces = false

[tool.setuptools.package-data]
"*" = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pib.settings"
testpaths = ["tests"]
pythonpath = ["."]
