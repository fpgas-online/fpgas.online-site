{# One port's box in a switch's front panel (#90, #130): drawn at (x, y), its id ending in `suffix` (the narrow drawing's boxes are "-n"). Geometry: panel.WIDTH x panel.HEIGHT. #}<a href="{{ p.href }}" aria-label="{{ p.title }}"><g id="switch-{{ anchor }}-panel-{{ p.port }}{{ suffix }}" class="mgmt-port mgmt-box-{{ p.kind }} mgmt-edge-{% if p.link_up %}up{% else %}down{% endif %}"><title>{{ p.title }}</title><rect x="{{ x|add:1 }}" y="{{ y|add:1 }}" width="50" height="70" rx="3"/><text class="mgmt-pnum" x="{{ x|add:4 }}" y="{{ y|add:14 }}">{{ p.port }}</text><text class="mgmt-pmark mgmt-state-{{ p.kind }}" x="{{ x|add:48 }}" y="{{ y|add:15 }}" text-anchor="end" aria-hidden="true">{{ p.mark }}</text>{% for line in p.lines %}<text class="mgmt-hw" x="{{ x|add:26 }}" y="{% if forloop.counter == 1 %}{{ y|add:30 }}{% elif forloop.counter == 2 %}{{ y|add:43 }}{% else %}{{ y|add:56 }}{% endif %}" text-anchor="middle" aria-hidden="true">{{ line }}</text>{% endfor %}<text class="mgmt-bolt" x="{{ x|add:4 }}" y="{{ y|add:67 }}" aria-hidden="true">{{ p.bolt }}</text><text class="mgmt-more" x="{{ x|add:26 }}" y="{{ y|add:67 }}" text-anchor="middle" aria-hidden="true">{{ p.more }}</text><text class="mgmt-net mgmt-test-fail" x="{{ x|add:48 }}" y="{{ y|add:67 }}" text-anchor="end" aria-hidden="true">{{ p.net }}</text></g></a>
