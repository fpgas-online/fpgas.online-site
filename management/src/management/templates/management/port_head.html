{# The switch port table's header (switches.html, and a Pi's own page, machine.html: one source, so the two never drift). #}
<thead><tr>
      <th scope="col" class="c-port" title="{{ head_titles.port }}">Port</th>
      <th scope="col" class="c-model" title="{{ head_titles.model }}">Model</th>
      <th scope="col" class="c-memory" title="{{ head_titles.ram }}">RAM</th>
      <th scope="col" class="c-board" title="{{ head_titles.board }}">Board</th>
      <th scope="col" class="mgmt-checkhead c-state" title="{{ head_titles.state }}">State</th>
      <th scope="col" class="c-serial" title="{{ head_titles.serial }}">Serial</th>
      <th scope="col" class="c-lease" title="{{ head_titles.lease }}">Lease</th>
      <th scope="col" class="mgmt-checkhead c-net" title="{{ head_titles.net }}">Net</th>
      <th scope="col" class="mgmt-checkhead c-link" title="{{ head_titles.link }}">Link</th>
      <th scope="col" class="mgmt-checkhead c-poe" title="{{ head_titles.poe }}">PoE</th>
      <th scope="col" class="c-watts" title="{{ head_titles.watts }}">W</th>
      <th scope="col" class="c-power" title="{{ head_titles.power }}"><span aria-hidden="true">⏻</span><span class="mgmt-sr">Power</span></th>
      <th scope="col" class="c-vlan" title="{{ head_titles.vlan }}">VLAN</th>
      <th scope="col" class="c-gw" title="{{ head_titles.gw }}">GW</th>
      <th scope="col" class="c-lldp" title="{{ head_titles.lldp }}">LLDP</th>
      <th scope="col" class="c-lldp-port" title="{{ head_titles.lldp_port }}">LLDP port</th>
      <th scope="col" class="c-rx" title="{{ head_titles.rx }}">In</th>
      <th scope="col" class="c-tx" title="{{ head_titles.tx }}">Out</th>
      <th scope="col" class="c-rx-errors" title="{{ head_titles.rx_errors }}">Rx err</th>
      <th scope="col" class="c-tx-errors" title="{{ head_titles.tx_errors }}">Tx err</th>
      <th scope="col" class="c-role" title="{{ head_titles.role }}">Role</th>
</tr></thead>
